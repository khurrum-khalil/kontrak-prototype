<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Kontrak — Student app</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{height:100%}body{background:var(--warm-white)}</style>
</head><body>
<div id="root"></div>
<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel" src="Dashboard.jsx"></script>
<script type="text/babel" src="Briefs.jsx"></script>
<script type="text/babel" src="ContractDetail.jsx"></script>
<script type="text/babel" src="Messages.jsx"></script>
<script type="text/babel" data-presets="react">
(function(){
const { Button, Icon } = window.KontrakDesignSystem_5cbea0;
const TITLES = {
  dashboard: ['Aisha Rahman · LLM candidate', 'Your work'],
  briefs: ['34 open briefs', 'Find briefs'],
  contracts: ['Engagement letter · KTK-2026-0413', 'Contract'],
  messages: ['3 conversations', 'Messages'],
  payments: ['Escrow and payouts', 'Payments'],
};
function App(){
  const [route, setRoute] = React.useState('dashboard');
  const [eyebrow, title] = TITLES[route];
  return (
    <div style={{ display:'flex', minHeight:'100vh' }}>
      <Sidebar route={route} go={setRoute} />
      <main style={{ flex:1, minWidth:0 }}>
        <TopBar eyebrow={eyebrow} title={title} actions={route === 'briefs'
          ? <Button variant="accent" size="sm" iconLeft={<Icon name="plus" size={14} />}>Save search</Button>
          : <Button variant="primary" size="sm" onClick={() => setRoute('briefs')} iconLeft={<Icon name="search" size={14} />}>Find work</Button>} />
        {route === 'dashboard' && <Dashboard go={setRoute} />}
        {route === 'briefs' && <Briefs go={setRoute} />}
        {route === 'contracts' && <ContractDetail go={setRoute} />}
        {route === 'messages' && <Messages />}
        {route === 'payments' && <ContractDetail go={setRoute} />}
      </main>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
})();
</script>
</body></html>
