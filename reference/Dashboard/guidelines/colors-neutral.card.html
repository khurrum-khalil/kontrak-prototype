<!-- @dsCard group="Colors" viewport="700x150" name="Warm neutrals" subtitle="Paper tones and hairline greys" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px 20px;background:var(--warm-white)}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--radius-sm)}.nm{font-family:var(--font-body);font-size:10px;color:var(--text-muted);letter-spacing:.02em}.hx{font-family:var(--font-mono);font-size:9px;color:var(--text-faint)}.grid{display:grid;gap:10px}</style>
</head><body><div class="grid" style="grid-template-columns:repeat(8,1fr)"><div class="sw"><div class="chip" style="background:#F7F5F0;border:1px solid var(--border-subtle)"></div><div class="nm">warm-white</div><div class="hx">#F7F5F0</div></div><div class="sw"><div class="chip" style="background:#EDE9E0;border:1px solid var(--border-subtle)"></div><div class="nm">parchment</div><div class="hx">#EDE9E0</div></div><div class="sw"><div class="chip" style="background:#E5E2D9"></div><div class="nm">stone-200</div><div class="hx">#E5E2D9</div></div><div class="sw"><div class="chip" style="background:#D8D3C8"></div><div class="nm">stone-300</div><div class="hx">#D8D3C8</div></div><div class="sw"><div class="chip" style="background:#B4AEA1"></div><div class="nm">stone-400</div><div class="hx">#B4AEA1</div></div><div class="sw"><div class="chip" style="background:#8A8A8A"></div><div class="nm">gray-600</div><div class="hx">#8A8A8A</div></div><div class="sw"><div class="chip" style="background:#BBBBBB"></div><div class="nm">gray-400</div><div class="hx">#BBBBBB</div></div><div class="sw"><div class="chip" style="background:#DDDDDD"></div><div class="nm">gray-200</div><div class="hx">#DDDDDD</div></div></div></body></html>
