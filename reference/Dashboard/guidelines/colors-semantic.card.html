<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px 20px;background:var(--warm-white)}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--radius-sm)}.nm{font-family:var(--font-body);font-size:10px;color:var(--text-muted);letter-spacing:.02em}.hx{font-family:var(--font-mono);font-size:9px;color:var(--text-faint)}.grid{display:grid;gap:10px}</style>
</head><body><div class="grid" style="grid-template-columns:repeat(8,1fr)"><div class="sw"><div class="chip" style="background:#1F7A5C"></div><div class="nm">success</div><div class="hx">#1F7A5C</div></div><div class="sw"><div class="chip" style="background:#E3F0EA"></div><div class="nm">success-soft</div><div class="hx">#E3F0EA</div></div><div class="sw"><div class="chip" style="background:#B8801C"></div><div class="nm">warning</div><div class="hx">#B8801C</div></div><div class="sw"><div class="chip" style="background:#FBF0DC"></div><div class="nm">warning-soft</div><div class="hx">#FBF0DC</div></div><div class="sw"><div class="chip" style="background:#A32B22"></div><div class="nm">danger</div><div class="hx">#A32B22</div></div><div class="sw"><div class="chip" style="background:#F7E7E4"></div><div class="nm">danger-soft</div><div class="hx">#F7E7E4</div></div><div class="sw"><div class="chip" style="background:#274462"></div><div class="nm">info</div><div class="hx">#274462</div></div><div class="sw"><div class="chip" style="background:#E7EDF4"></div><div class="nm">info-soft</div><div class="hx">#E7EDF4</div></div></div></body></html>
