<!-- @dsCard group="Colors" viewport="700x160" name="Approved pairings" subtitle="Text/background combinations that pass contrast" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px 20px;background:var(--warm-white)}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--radius-sm)}.nm{font-family:var(--font-body);font-size:10px;color:var(--text-muted);letter-spacing:.02em}.hx{font-family:var(--font-mono);font-size:9px;color:var(--text-faint)}.grid{display:grid;gap:10px}</style>
</head><body><div class="grid" style="grid-template-columns:repeat(4,1fr)">
<div style="background:#fff;padding:16px;border-radius:var(--radius-md);box-shadow:var(--shadow-card)"><div style="font:var(--text-h3)">Ink on white</div><div style="font-family:var(--font-body);font-size:12px;color:var(--text-muted);margin-top:6px">Default reading surface</div></div>
<div style="background:var(--warm-white);padding:16px;border-radius:var(--radius-md);border:1px solid var(--border-subtle)"><div style="font:var(--text-h3)">Ink on warm white</div><div style="font-family:var(--font-body);font-size:12px;color:var(--text-muted);margin-top:6px">Page background</div></div>
<div style="background:var(--navy-900);padding:16px;border-radius:var(--radius-md)"><div style="font-family:var(--font-display);font-weight:700;font-size:18px;color:#fff">White on navy</div><div style="font-family:var(--font-body);font-size:12px;color:var(--text-on-navy-muted);margin-top:6px">Hero, footer, dark cards</div></div>
<div style="background:var(--gold-600);padding:16px;border-radius:var(--radius-md)"><div style="font-family:var(--font-display);font-weight:700;font-size:18px;color:#fff">White on gold</div><div style="font-family:var(--font-body);font-size:12px;color:rgba(255,255,255,.75);margin-top:6px">Accent button only</div></div>
</div></body></html>
