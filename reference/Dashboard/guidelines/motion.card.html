<!-- @dsCard group="Brand" viewport="700x150" name="Motion" subtitle="180ms ease-out on colour and shadow; no bounce, no slide-in" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px 20px;background:var(--warm-white)}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--radius-sm)}.nm{font-family:var(--font-body);font-size:10px;color:var(--text-muted);letter-spacing:.02em}.hx{font-family:var(--font-mono);font-size:9px;color:var(--text-faint)}.grid{display:grid;gap:10px}</style>
</head><body><div style="display:flex;gap:14px;align-items:center;font-family:var(--font-body);font-size:12px;color:var(--text-muted)">
<button style="height:40px;padding:0 20px;border:none;border-radius:var(--radius-md);background:var(--navy-900);color:#fff;font:var(--text-ui);cursor:pointer;transition:background-color 180ms cubic-bezier(.2,.6,.2,1)" onmouseover="this.style.background='var(--navy-800)'" onmouseout="this.style.background='var(--navy-900)'">Hover me</button>
<span>Hover: darken. Press: translateY(1px). Focus: 4px gold ring.</span>
</div><div class="hx" style="margin-top:14px">--dur-fast 120 · --dur-base 180 · --dur-slow 240 · --ease-out cubic-bezier(.2,.6,.2,1)</div></body></html>
