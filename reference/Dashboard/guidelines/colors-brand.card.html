<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px 20px;background:var(--warm-white)}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--radius-sm)}.nm{font-family:var(--font-body);font-size:10px;color:var(--text-muted);letter-spacing:.02em}.hx{font-family:var(--font-mono);font-size:9px;color:var(--text-faint)}.grid{display:grid;gap:10px}</style>
</head><body><div class="grid" style="grid-template-columns:repeat(5,1fr)"><div class="sw"><div class="chip" style="background:#0D1B2A"></div><div class="nm">Deep Navy</div><div class="hx">#0D1B2A</div></div><div class="sw"><div class="chip" style="background:#C8922A"></div><div class="nm">Contract Gold</div><div class="hx">#C8922A</div></div><div class="sw"><div class="chip" style="background:#0F0F0F"></div><div class="nm">Ink Black</div><div class="hx">#0F0F0F</div></div><div class="sw"><div class="chip" style="background:#F7F5F0;border:1px solid var(--border-subtle)"></div><div class="nm">Warm White</div><div class="hx">#F7F5F0</div></div><div class="sw"><div class="chip" style="background:#EDE9E0;border:1px solid var(--border-subtle)"></div><div class="nm">Parchment</div><div class="hx">#EDE9E0</div></div></div></body></html>
