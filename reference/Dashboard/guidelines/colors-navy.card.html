</head><body><div class="grid" style="grid-template-columns:repeat(8,1fr)"><div class="sw"><div class="chip" style="background:#0D1B2A"></div><div class="nm">navy-900</div><div class="hx">#0D1B2A</div></div><div class="sw"><div class="chip" style="background:#132539"></div><div class="nm">navy-800</div><div class="hx">#132539</div></div><div class="sw"><div class="chip" style="background:#1B3149"></div><div class="nm">navy-700</div><div class="hx">#1B3149</div></div><div class="sw"><div class="chip" style="background:#274462"></div><div class="nm">navy-600</div><div class="hx">#274462</div></div><div class="sw"><div class="chip" style="background:#3A5C7E"></div><div class="nm">navy-500</div><div class="hx">#3A5C7E</div></div><div class="sw"><div class="chip" style="background:#7C97B4"></div><div class="nm">navy-300</div><div class="hx">#7C97B4</div></div><div class="sw"><div class="chip" style="background:#C9D6E2"></div><div class="nm">navy-100</div><div class="hx">#C9D6E2</div></div><div class="sw"><div class="chip" style="background:#E7EDF4"></div><div class="nm">navy-050</div><div class="hx">#E7EDF4</div></div></div></body></html>
