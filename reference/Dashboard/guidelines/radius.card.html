<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px 20px;background:var(--warm-white)}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--radius-sm)}.nm{font-family:var(--font-body);font-size:10px;color:var(--text-muted);letter-spacing:.02em}.hx{font-family:var(--font-mono);font-size:9px;color:var(--text-faint)}.grid{display:grid;gap:10px}</style>
</head><body><div class="row" style="display:flex;gap:18px;align-items:flex-end">
<div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:64px;height:64px;background:var(--navy-900);border-radius:2px"></div><div class="nm">xs</div><div class="hx">2px</div></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:64px;height:64px;background:var(--navy-900);border-radius:4px"></div><div class="nm">sm</div><div class="hx">4px</div></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:64px;height:64px;background:var(--navy-900);border-radius:6px"></div><div class="nm">md</div><div class="hx">6px</div></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:64px;height:64px;background:var(--navy-900);border-radius:10px"></div><div class="nm">lg</div><div class="hx">10px</div></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:64px;height:64px;background:var(--navy-900);border-radius:14px"></div><div class="nm">xl</div><div class="hx">14px</div></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:64px;height:64px;background:var(--navy-900);border-radius:16px"></div><div class="nm">2xl</div><div class="hx">16px</div></div>
<div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:80px;height:34px;background:var(--navy-900);border-radius:999px"></div><div class="nm">pill</div><div class="hx">tags only</div></div>
</div></body></html>
