<!-- @dsCard group="Brand" viewport="700x180" name="Shadow system" subtitle="Whisper-quiet: 5% card, 7% raised, navy-tinted lift for the mark" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px 20px;background:var(--warm-white)}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--radius-sm)}.nm{font-family:var(--font-body);font-size:10px;color:var(--text-muted);letter-spacing:.02em}.hx{font-family:var(--font-mono);font-size:9px;color:var(--text-faint)}.grid{display:grid;gap:10px}</style>
</head><body><div class="grid" style="grid-template-columns:repeat(4,1fr)">
<div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:100%;height:64px;background:#fff;border-radius:var(--radius-md);box-shadow:0 1px 4px rgba(0,0,0,.05)"></div><div class="nm">--shadow-card</div><div class="hx">0 1px 4px rgba(0,0,0,.05)</div></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:100%;height:64px;background:#fff;border-radius:var(--radius-md);box-shadow:0 2px 8px rgba(13,27,42,.07)"></div><div class="nm">--shadow-raised</div><div class="hx">0 2px 8px rgba(13,27,42,.07)</div></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:100%;height:64px;background:#fff;border-radius:var(--radius-md);box-shadow:0 4px 16px rgba(13,27,42,.18)"></div><div class="nm">--shadow-lift</div><div class="hx">0 4px 16px rgba(13,27,42,.18)</div></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:100%;height:64px;background:#fff;border-radius:var(--radius-md);box-shadow:0 12px 32px rgba(13,27,42,.12)"></div><div class="nm">--shadow-pop</div><div class="hx">0 12px 32px rgba(13,27,42,.12)</div></div>
</div></body></html>
