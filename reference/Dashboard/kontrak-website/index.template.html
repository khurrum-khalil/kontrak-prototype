<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Kontrak — Work Legal, Work Smart</title>
<link rel="icon" href="assets/app-icon.svg">
<link rel="stylesheet" href="css/styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="lib/kontrak-ds.js"></script>
<style>body{background:var(--warm-white)}
@keyframes kFadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes kFadeIn{from{opacity:0}to{opacity:1}}
@keyframes kRule{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes kPulse{0%,100%{opacity:.55}50%{opacity:1}}
.k-reveal{opacity:0}
.k-reveal.in{animation:kFadeUp 620ms var(--ease-out) both}
.k-enter{animation:kFadeUp 700ms var(--ease-out) both}
.k-fade{animation:kFadeIn 900ms var(--ease-out) both}
.k-rule{transform-origin:left;animation:kRule 720ms var(--ease-out) both}
.k-pulse{animation:kPulse 2.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.k-reveal,.k-reveal.in,.k-enter,.k-fade,.k-rule,.k-pulse{animation:none!important;opacity:1!important;transform:none!important}}
</style>
</head><body>
<div id="root"></div>
<!-- SCREENS -->
<script type="text/babel" data-presets="react">
(function(){
function Site(){
  const [route, setRoute] = React.useState('home');
  const go = (r) => { setRoute(r); window.scrollTo(0,0); };
  return (
    <div>
      <SiteHeader route={route} go={go} />
      {route === 'home' && <Home go={go} />}
      {route === 'work' && <BrowseWork go={go} />}
      {route === 'gig' && <GigDetail go={go} />}
      {route === 'clients' && <ForClients go={go} />}
      {route === 'visa' && <VisaRules go={go} />}
      {route === 'pricing' && <Pricing go={go} />}
      {route === 'signup' && <SignUp go={go} />}
      {route !== 'signup' && <SiteFooter go={go} />}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Site />);
})();
</script>
</body></html>
